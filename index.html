<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Weathery</title>
</head>
<body>
    <script src="script.js"></script>

    <nav>
        <div id="div1"><h1>WEATHERY</h1></div>
        <div id="div2"><h1><a href="https://www.facebook.com/yahjabel/">BY YAHJ LAPID</a></h1></div>
    </nav>

    <hr class="main-hr">

    <article>
        <div class="circle">
            <div class="outer"><div class="middle"><div class="inner"></div></div></div>
        </div>
        <div class="main-info">
            <div class="container1">
                <div class="temp"><h1 id="temp">_____</h1></div>
                <div class="wind"><h1 id="wind"></h1></div>
            </div>
            <div class="country"><p id="country">_____</p></div>
        </div>
    </article>

    <div class="main-container">
        <div class="forecast">
            <h2>Forecast</h2>
            <div class="data-container">
                <div class="data-info"><p class="date">Tomorrow</p><p class="data">__________</p></div>
                <hr class="data-hr">
                <div class="data-info"><p class="date">__________</p><p class="data">__________</p></div>
                <hr class="data-hr">
                <div class="data-info"><p class="date">__________</p><p class="data">__________</p></div>
                <hr class="data-hr">
                <div class="data-info"><p class="date">__________</p><p class="data">__________</p></div>
                <hr class="data-hr">
                <div class="data-info"><p class="date">__________</p><p class="data">__________</p></div>
                <br>
            </div>
        </div>
        <div class="past">
            <h2>Past week</h2>
            <div class="data-container">
                <div class="data-info"><p class="date" id="p1">Yesterday</p><p class="data">__________</p></div>
                <hr class="data-hr">
                <div class="data-info"><p class="date" id="p2">__________</p><p class="data">__________</p></div>
                <hr class="data-hr">
                <div class="data-info"><p class="date" id="p3">__________</p><p class="data">__________</p></div>
                <hr class="data-hr">
                <div class="data-info"><p class="date" id="p4">__________</p><p class="data">__________</p></div>
                <hr class="data-hr">
                <div class="data-info"><p class="date" id="p5">__________</p><p class="data">__________</p></div>
                <br>
            </div>
        </div>
    </div>
    


</body>
</html>
